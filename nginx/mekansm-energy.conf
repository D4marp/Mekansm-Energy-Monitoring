# Upstream backend server
upstream backend_upstream {
    server 103.27.207.58:5002;
    keepalive 32;
}

# Upstream frontend Next.js server
upstream frontend_upstream {
    server 103.27.207.58:3000;
    keepalive 32;
}

# HTTP to HTTPS redirect (optional - uncomment if using SSL)
# server {
#     listen 80;
#     server_name 103.27.207.58;
#     return 301 https://$server_name$request_uri;
# }

# Main server configuration
server {
    listen 3001;
    server_name 103.27.207.58;
    
    # Request body size
    client_max_body_size 10M;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_disable "msie6";
    
    # Logging
    access_log /var/log/nginx/mekansm-energy-access.log;
    error_log /var/log/nginx/mekansm-energy-error.log;
    
    # API routes - redirect to backend
    location /api/ {
        proxy_pass http://backend_upstream;
        
        # Preserve headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Connection settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
    
    # Health check endpoint
    location /health {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }
    
    # WebSocket support (if needed)
    location /ws {
        proxy_pass http://backend_upstream;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Disable buffering for WebSocket
        proxy_buffering off;
    }
    
    # Frontend - serve Next.js
    location / {
        proxy_pass http://frontend_upstream;
        
        # Preserve headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Connection settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
    
    # Deny access to sensitive files
    location ~ /\. {
        deny all;
    }
    
    location ~ ~$ {
        deny all;
    }
}

# Optional: Upstream configuration untuk stress testing / load balancing
# Uncomment untuk multiple backend servers:
